<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/games/neon-rider/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rider | 3D Racing</title>
    <meta name="description"
        content="Experience high-speed 3D racing in the retro-futuristic world of Neon Rider. Dodge obstacles and ride into the synthwave sunset." />
    <meta name="keywords"
        content="neon rider game, 3D racing game, synthwave racing, retro driving game, endless runner racing, neon style browser game" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="High-speed neon racing — avoid traffic, beat your best!">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/games/neon-rider/style.css">
    <link rel="icon" href="neon_rider_small.webp">
    <script src="/analytics.js"></script>
</head>

<body>
    <div id="game-container">


        <div id="preloader">
            <div class="loader-logo">🏎️</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
            <div class="loading-text">Loading...</div>
        </div>


        <div id="hud" class="hidden">
            <div class="hud-item" id="score-display">0 m</div>
            <div class="hud-item hud-speed" id="speed-display">0 KM/H</div>
            <div class="sound-toggle" id="sound-toggle" title="Toggle Sound">
                <svg id="snd-on" viewBox="0 0 24 24">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
                <svg id="snd-off" viewBox="0 0 24 24" style="display:none">
                    <path
                        d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-16.46-16.73L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
                </svg>
            </div>
        </div>


        <div id="start-screen" class="overlay hidden">
            <h1>NEON RIDER</h1>
            <p class="subtitle">High-Speed Neon Racing</p>
            <p class="hint">← → Arrow keys &nbsp;|&nbsp; Tap buttons on mobile</p>
            <button class="btn" id="start-btn">START RACE</button>
        </div>


        <div id="game-over" class="overlay hidden">
            <h2 class="crash-title">CRASHED!</h2>
            <p id="final-score" class="go-stat">Distance: 0 m</p>
            <p id="best-score" class="go-best">Best: 0 m</p>
            <button class="btn" id="restart-btn">RACE AGAIN</button>
        </div>


        <canvas id="gameCanvas"></canvas>


        <div id="controls">
            <div class="ctrl-btn" id="left-btn">◀</div>
            <div class="ctrl-btn" id="right-btn">▶</div>
        </div>

    </div>
    <script src="/games/neon-rider/script.js"></script>
</body>

</html>
