<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/games/fruit-slicer/">
  <title>Fruit Slicer | Slice Action Game</title>
  <meta name="description"
    content="Slice flying fruits in this fast-paced action game! Test your reflexes in Fruit Slicer and avoid cutting the bombs." />
  <meta name="keywords"
    content="fruit slicer game, slice action game, fruit cutting game, ninja slice, free online action game, HTML5 fruit game" />
  <meta name="robots" content="index, follow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Slice fruits in this fast-paced arcade game!" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="fruit_slice_small.webp">
    <script src="/analytics.js"></script>
</head>

<body>
  <div id="container">


    <div id="fruitcontainer">


      <svg class="bg-slashes" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <line x1="80" y1="60" x2="200" y2="180" stroke="rgba(0,0,0,0.18)" stroke-width="2" stroke-linecap="round" />
        <line x1="95" y1="55" x2="215" y2="175" stroke="rgba(0,0,0,0.10)" stroke-width="1" />
        <line x1="460" y1="30" x2="610" y2="160" stroke="rgba(0,0,0,0.18)" stroke-width="2" stroke-linecap="round" />
        <line x1="475" y1="25" x2="625" y2="155" stroke="rgba(0,0,0,0.10)" stroke-width="1" />
        <line x1="130" y1="300" x2="280" y2="420" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-linecap="round" />
        <line x1="500" y1="280" x2="650" y2="400" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-linecap="round" />
        <line x1="300" y1="100" x2="380" y2="230" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round" />
      </svg>


      <div id="score-overlay">
        <span id="scoreValue">0</span>
      </div>


      <div id="lives-overlay">
        <span class="life" id="life2">✕</span>
        <span class="life" id="life1">✕</span>
        <span class="life" id="life0">✕</span>
      </div>


      <div id="btn-sound" title="Toggle Sound">
        <svg id="icon-snd-on" viewBox="0 0 24 24">
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
        <svg id="icon-snd-off" viewBox="0 0 24 24" style="display:none">
          <path
            d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51c.66-1.24 1.03-2.65 1.03-4.15 0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
      </div>


      <img id="fruit1" class="fruit" alt="fruit" draggable="false" />


      <div id="juice-splat"></div>


      <canvas id="sliceCanvas"></canvas>


      <div id="blade-cursor">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polygon points="12,2 14,20 12,18 10,20" fill="white" opacity="0.95" />
          <polygon points="12,2 14,20 12,18 10,20" fill="rgba(251,191,36,0.4)" />
        </svg>
      </div>


      <div id="front">
        <div class="front-inner">
          <div class="splash-emoji">🍓 🍊 🍋</div>
          <h1 class="splash-title">Fruit Slicer</h1>
          <p class="splash-sub">Hold &amp; drag to slice fruits!</p>
          <p class="splash-sub dim">On mobile — swipe with your finger</p>
        </div>
      </div>


      <div id="gameOver"></div>

    </div>


    <div id="startReset">▶ Start Game</div>

  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
