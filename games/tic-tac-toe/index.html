<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/games/tic-tac-toe/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Play a fast, responsive 2-Player Tic Tac Toe game with sound effects, theme toggle, and smooth animations. Enjoy classic gameplay on any device.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.qyrogames.com/game/tic-tac-toe">
    <title>Play Tic Tac Toe Online - Free Interactive Game</title>
    <meta name="description"
        content="Play the classic Tic Tac Toe game online for free! Challenge a friend or play against an AI opponent in this interactive and fun board game." />
    <meta name="keywords"
        content="tic tac toe online, free tic tac toe, classic board game, naughts and crosses, multiplayer browser game, tic tac toe AI" />
    <meta name="robots" content="index, follow" />


    <link rel="icon" href="tic_tac_toe_small.webp">


    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Sigmar&display=swap">


    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js" defer></script>


    <meta name="google-site-verification" content="y3Q5vjJBADSZaxgRi1yyC7zrIZOysY6mblje2oh3_24" />


    <meta property="og:title" content="Play Tic Tac Toe Online - Free Interactive Game">
    <meta property="og:description"
        content="Enjoy a clean and fast 2-Player Tic Tac Toe game with sound effects and theme options.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://us-tictactoe.netlify.app//assets/preview.png">
    <meta property="og:image:alt" content="Tic Tac Toe game preview">
    <meta property="og:url" content="https://us-tictactoe.netlify.app/">



    <script src="/analytics.js"></script>
</head>

<body class="lightMode">
    <header>
    <base href="/games/tic-tac-toe/">
        <div id="stats">
            <p>
                <span class="x">X</span>
                Player
            </p>
            <div id="separator">|</div>
            <p>
                <span class="o">O</span>
                <span style="transform: translateY(-1px);">Player</span>
            </p>
        </div>
        <h1 class="hoverEffect"><a href="#" aria-label="TicTacToe Home">Tic Tac Toe</a></h1>
        <div id="controls">
            <div id="toggleSound" class="hoverEffect">
                <iconify-icon id="soundOn" icon="fluent:speaker-2-24-filled"></iconify-icon>
                <iconify-icon id="soundOff" icon="fluent:speaker-mute-24-filled"></iconify-icon>
            </div>
            <div id="toggleTheme" class="hoverEffect">
                <iconify-icon id="sun" icon="si:sun-fill"></iconify-icon>
                <iconify-icon id="moon" icon="bi:moon-stars-fill"></iconify-icon>
            </div>
        </div>
    </header>
    <main>
        <section id="gameCont">
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <div role="button" aria-label="Game Cell" class="box"></div>
            <span id="wonLine">|</span>
        </section>

        <section id="buttonCont">
            <button class="restart hoverEffect">Restart</button>
        </section>
    </main>

    <aside>
        <p id="wonMsg">
            <iconify-icon class="emoji" icon="radix-icons:face"></iconify-icon>
            <span>🎉 Player <span id="winner"></span> Won!</span>
        </p>
        <p id="drawMsg">
            <iconify-icon class="emoji" icon="cil:face"></iconify-icon>
            ⚔ Its a Draw !
        </p>
        <button class="restart hoverEffect" style="transform: scale(0.9);">New Game</button>
        <div style="display: none;">
            <audio id="ting" src="assets/ting.mp3" autoplay="false" preload="auto"></audio>
            <audio id="gameOver" src="assets/gameOver.mp3" autoplay="false" preload="auto"></audio>
            <audio id="error" src="assets/error.mp3" autoplay="false" preload="auto"></audio>
            <audio id="won" src="assets/won.mp3" autoplay="false" preload="none"></audio>
        </div>
    </aside>

    <script src="script.js"></script>

</body>

</html>
